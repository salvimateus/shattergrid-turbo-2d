<script>
;(function(){
// ──── config.js ────
// ═══ CONFIG ═══
const FIELD_W = 14, FIELD_H = 20
const PADDLE_W_DEF = 2.4, PADDLE_H = 0.35
const PADDLE_Y = -FIELD_H / 2 + 3.5
const BALL_R = 0.2, BALL_SPEED_INIT = 0.14, BALL_SPEED_MAX = 0.26
const BRICK_ROWS = 7, BRICK_COLS = 10
const BRICK_W = 1.2, BRICK_H = 0.45, BRICK_GAP = 0.1
const BRICK_START_Y = FIELD_H / 2 - 3
const MAX_LIVES = 3, DROP_CHANCE = 0.65, GLASS_CHANCE = 0.12
const CHARGE_DUR = 90
const FIELD_MARGIN = 0.8

const DISABLE_SFX   = false
const DISABLE_MUSIC = false

// Mobile detection & perf tuning
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window && innerWidth < 900)
const MAX_PARTICLES_CAP = 600
const TRAIL_INTERVAL = 2
const CHARGE_PARTICLE_INTERVAL = 3
const BOMB_TRAIL_INTERVAL = 3
const STEPS_PER_FRAME = 1


// ──── state.js ────
// ═══ STATE ═══
let gameState = 'start', score = 0, combo = 0, lives = MAX_LIVES
let mouseX = 0, shakeAmt = 0, shakeX = 0, shakeY = 0, frame = 0
let paddleW = PADDLE_W_DEF
let paddleX = 0, targetPaddleX = 0
let paddleYOffset = 0
let currentPaddleY = PADDLE_Y, targetPaddleY = PADDLE_Y
let paddleTilt = 0
let timeScale = 1, timeScaleTimer = 0, timeAccum = 0
let bwTimer = 0, crtTimer = 0, filmTimer = 0
let growTimer = 0, shrinkTimer = 0, glassTimer = 0, bombTimer = 0
let paddleUpTimer = 0, paddleDownTimer = 0
let savedPaddleW = PADDLE_W_DEF
let glassBrickIds = []
let initialBrickCount = 0, aliveBrickCount = 0
let musicIntensity = 0
let dropLog = []
let bricks = [], particles = [], trails = [], drops = [], balls = [], bombs = []
let charging = false, chTimer = 0, chParts = []
let laserSightTimer = 0
let spinTimer = 0, ghostTimer = 0
// Pressão do paddle contra as paredes laterais (0..1)
let wallNudgeLeft = 0, wallNudgeRight = 0

let wallTiltLeft = 0, wallTiltRight = 0

// ──── audio.js ────
// ═══ 8-BIT SOUND ENGINE ═══
let actx = null
function ensureAudio() {
  if (DISABLE_SFX) return
  if (!actx)
    actx = new (window.AudioContext || window.webkitAudioContext)()
  if (actx.state === 'suspended') actx.resume()
}

function tone(freq, dur, type = 'square', vol = 0.15, slide = 0) {
  if (DISABLE_SFX || !actx) return
  const o = actx.createOscillator(),
    g = actx.createGain()
  o.type = type
  o.frequency.setValueAtTime(freq, actx.currentTime)
  if (slide)
    o.frequency.exponentialRampToValueAtTime(
      Math.max(20, freq + slide),
      actx.currentTime + dur,
    )
  g.gain.setValueAtTime(vol, actx.currentTime)
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
  o.connect(g)
  g.connect(actx.destination)
  o.start()
  o.stop(actx.currentTime + dur)
}

function noise(dur, vol = 0.08) {
  if (DISABLE_SFX || !actx) return
  const n = actx.sampleRate * dur,
    buf = actx.createBuffer(1, n, actx.sampleRate),
    d = buf.getChannelData(0)
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1
  const s = actx.createBufferSource(),
    g = actx.createGain()
  s.buffer = buf
  g.gain.setValueAtTime(vol, actx.currentTime)
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
  s.connect(g)
  g.connect(actx.destination)
  s.start()
}

const SFX = {
  paddleHit() {
    tone(400, 0.08, 'square', 0.12)
    tone(600, 0.06, 'square', 0.08)
  },
  wallHit() {
    tone(220, 0.05, 'triangle', 0.08)
  },
  brickHit(c) {
    const f = 300 + Math.min(c, 15) * 40
    tone(f, 0.1, 'square', 0.12)
  },
  brickDestroy(c) {
    const f = 400 + Math.min(c, 15) * 50
    tone(f, 0.15, 'square', 0.15, 200)
    noise(0.08, 0.06)
  },
  glassBreak() {
    tone(1200, 0.08, 'sine', 0.1)
    tone(1800, 0.06, 'sine', 0.08)
    noise(0.12, 0.1)
  },
  loseLife() {
    tone(400, 0.15, 'square', 0.15, -300)
    setTimeout(() => tone(200, 0.2, 'square', 0.12, -150), 150)
  },
  gameOver() {
    ;[400, 350, 300, 200].forEach((f, i) =>
      setTimeout(() => tone(f, 0.25, 'square', 0.15), i * 200),
    )
  },
  win() {
    ;[523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => tone(f, 0.2, 'square', 0.15), i * 120),
    )
  },
  powerGood() {
    tone(600, 0.08, 'square', 0.12)
    setTimeout(() => tone(900, 0.1, 'square', 0.1), 60)
    setTimeout(() => tone(1200, 0.12, 'square', 0.1), 120)
  },
  powerBad() {
    tone(400, 0.1, 'sawtooth', 0.12)
    tone(200, 0.15, 'sawtooth', 0.1)
  },
  dropCatch() {
    tone(800, 0.06, 'sine', 0.1)
  },
  chargeUp(p) {
    tone(200 + p * 600, 0.04, 'sine', 0.06)
  },
  chargeLaunch() {
    tone(600, 0.15, 'square', 0.15, 400)
    noise(0.1, 0.08)
  },
  bombBounce() {
    tone(250, 0.08, 'square', 0.12)
    tone(350, 0.06, 'triangle', 0.08)
  },
  bombExplode() {
    noise(0.3, 0.2)
    tone(100, 0.3, 'sawtooth', 0.18, -80)
    setTimeout(() => noise(0.2, 0.12), 100)
    setTimeout(() => tone(60, 0.2, 'square', 0.1), 150)
  },
}


// ──── music.js ────
// ═══ BACKGROUND MUSIC + MUFFLE (Balatro-style) ═══
let musicPlaying=false,musicNodes=[],musicGain=null,musicBPM=130,musicStep=0,musicInterval=null
let musicMuffleFilter=null,musicMuffleGain=null,musicDistortion=null,isMuffled=false
function _makeMuffleDistCurve(amt){const n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(Math.PI+amt)*x/(Math.PI+amt*Math.abs(x))}return c}
function startMusic(){
  if(DISABLE_MUSIC||IS_MOBILE||musicPlaying||!actx)return;musicPlaying=true;musicStep=0
  musicGain=actx.createGain();musicGain.gain.setValueAtTime(1.0,actx.currentTime)
  musicMuffleFilter=actx.createBiquadFilter();musicMuffleFilter.type='lowpass'
  musicMuffleFilter.frequency.setValueAtTime(20000,actx.currentTime);musicMuffleFilter.Q.setValueAtTime(0.7,actx.currentTime)
  musicDistortion=actx.createWaveShaper();musicDistortion.curve=_makeMuffleDistCurve(0);musicDistortion.oversample='2x'
  musicMuffleGain=actx.createGain();musicMuffleGain.gain.setValueAtTime(0.55,actx.currentTime)
  musicGain.connect(musicMuffleFilter);musicMuffleFilter.connect(musicDistortion);musicDistortion.connect(musicMuffleGain);musicMuffleGain.connect(actx.destination)
  if(isMuffled)_applyMuffle()
  const bn0=[55,55,65.4,55,73.4,55,65.4,82.4],ln0=[220,330,440,330,293,440,523,440,261,392,523,392,349,523,659,523],hh0=[1,0,1,1,1,0,1,0]
  const bn1=[55,73.4,55,82.4,65.4,98,73.4,110],ln1=[330,440,523,659,440,523,659,784,349,466,523,698,466,587,698,880],hh1=[1,1,1,1,1,0,1,1]
  const bn2=[73.4,82.4,98,110,82.4,110,130.8,110],ln2=[440,523,659,784,523,659,880,1047,466,587,698,880,587,784,1047,1175],hh2=[1,1,1,1,1,1,1,1]
  const bA=[bn0,bn1,bn2],lA=[ln0,ln1,ln2],hA=[hh0,hh1,hh2],bpms=[130,155,180]
  const bV=[0.12,0.18,0.28],lbV=[0.02,0.04,0.08],lmV=[0.06,0.10,0.16],hhV=[0.04,0.06,0.10],kV=[0.15,0.20,0.32]
  const mi=musicIntensity,sd=60/bpms[mi]/2
  musicInterval=setInterval(()=>{
    if(!actx||gameState==='start')return;const t=actx.currentTime,bn=bA[mi],ln=lA[mi],hh=hA[mi]
    if(musicStep%2===0){const i=Math.floor(musicStep/2)%bn.length,o=actx.createOscillator(),g=actx.createGain();o.type=mi>=2?'sawtooth':'triangle';o.frequency.setValueAtTime(bn[i],t);g.gain.setValueAtTime(bV[mi],t);g.gain.exponentialRampToValueAtTime(0.001,t+sd*1.8);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+sd*1.8)}
    const li=musicStep%ln.length,ol=actx.createOscillator(),gl=actx.createGain();ol.type='square';ol.frequency.setValueAtTime(ln[li],t);const v=Math.min(lmV[mi],lbV[mi]+musicStep*0.0003);gl.gain.setValueAtTime(v,t);gl.gain.exponentialRampToValueAtTime(0.001,t+sd*0.8);ol.connect(gl);gl.connect(musicGain);ol.start(t);ol.stop(t+sd*0.8)

// ──── renderer.js ────
// ═══ CANVAS 2D RENDERER ═══
const canvas = document.getElementById('game-canvas')
const ctx = canvas.getContext('2d')
let scale = 1, cxOff = 0, cyOff = 0

function resize() {
  canvas.width = innerWidth
  canvas.height = innerHeight
  const sx = canvas.width / (FIELD_W + FIELD_MARGIN * 2)
  const sy = canvas.height / (FIELD_H + FIELD_MARGIN * 2)
  scale = Math.min(sx, sy)
  cxOff = canvas.width / 2
  cyOff = canvas.height / 2
}
resize()

// World → Canvas coordinate helpers
function wx(x) { return cxOff + x * scale }
function wy(y) { return cyOff - y * scale }
function ws(s) { return s * scale }

// ─── Draw Helpers ───
function drawGlowRect(x, y, w, h, fill, glow, blur, alpha = 1) {
  ctx.save()
  ctx.globalAlpha = alpha
  if (blur > 0) { ctx.shadowColor = glow; ctx.shadowBlur = blur }
  ctx.fillStyle = fill
  const px = wx(x) - ws(w) / 2, py = wy(y) - ws(h) / 2
  const pw = ws(w), ph = ws(h), r = Math.min(4, pw / 4, ph / 4)
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, r); ctx.fill()
  ctx.restore()
}

function drawGlowCircle(x, y, r, fill, glow, blur, alpha = 1) {
  ctx.save()
  ctx.globalAlpha = alpha
  if (blur > 0) { ctx.shadowColor = glow; ctx.shadowBlur = blur }
  ctx.fillStyle = fill
  ctx.beginPath(); ctx.arc(wx(x), wy(y), ws(r), 0, Math.PI * 2); ctx.fill()
  ctx.restore()
}

// ─── Background ───
function drawBackground() {
  ctx.fillStyle = '#000011'
  ctx.fillRect(0, 0, canvas.width, canvas.height)
  // Grid (subtle wireframe like original)
  ctx.save()
  ctx.strokeStyle = IS_MOBILE ? '#1155cc' : '#1a1a4e'
  ctx.globalAlpha = 0.18
  ctx.lineWidth = 0.5
  ctx.translate(cxOff, cyOff)
  ctx.rotate(Math.sin(frame * 0.001) * 0.02)
  ctx.translate(-cxOff, -cyOff)
  const gridStep = 1.0, gridRange = 25
  for (let gx = -gridRange; gx <= gridRange; gx += gridStep) {
    ctx.beginPath(); ctx.moveTo(wx(gx), wy(-gridRange)); ctx.lineTo(wx(gx), wy(gridRange)); ctx.stroke()
  }
  for (let gy = -gridRange; gy <= gridRange; gy += gridStep) {
    ctx.beginPath(); ctx.moveTo(wx(-gridRange), wy(gy)); ctx.lineTo(wx(gridRange), wy(gy)); ctx.stroke()
  }
  ctx.restore()
}

// ─── Walls ───
function drawWalls() {
  const wt = 0.15
  const halfH = FIELD_H / 2

  // Offsets de chacoalho: ruído rápido que decai
  const shkL = (Math.random() - 0.5) * wallShakeLeft  * 0.28
  const shkR = (Math.random() - 0.5) * wallShakeRight * 0.28
  const shkT = (Math.random() - 0.5) * wallShakeTop   * 0.22

  // A parede inclina em torno do seu eixo central (pivot no centro da parede lateral)
  // wallTiltLeft/Right: ângulo em radianos, positivo = topo entra no campo
  const tL = wallTiltLeft, tR = wallTiltRight

  // Calcula os 4 cantos da parede esquerda inclinada (em coords de campo)
  // Centro da parede: (-FIELD_W/2, 0), altura FIELD_H + folga
  const wallCX_L = -FIELD_W / 2 - wt / 2
  const wallCX_R =  FIELD_W / 2 + wt / 2
  const hH = halfH + wt

  function drawTiltedWallFill(cx, tilt, shk, color, shadow) {
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt)
    // 4 cantos da parede no espaço do campo, rotacionados em torno do centro
    const corners = [
      [-wt / 2, -hH], [wt / 2, -hH], [wt / 2, hH], [-wt / 2, hH]
    ].map(([lx, ly]) => [
      cx + lx * cosT - ly * sinT + shk,
      ly * cosT + lx * sinT
    ])
    ctx.save()
    ctx.globalAlpha = 0.4
    ctx.shadowColor = shadow; ctx.shadowBlur = ws(0.6)
    ctx.fillStyle = color
    ctx.beginPath()
    ctx.moveTo(wx(corners[0][0]), wy(corners[0][1]))
    for (let i = 1; i < 4; i++) ctx.lineTo(wx(corners[i][0]), wy(corners[i][1]))
    ctx.closePath(); ctx.fill()
    ctx.restore()
  }

  function drawTiltedWallEdge(cx, tilt, shk, color, alpha, blur) {
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt)
    // Borda interna da parede (x local = 0, de -hH a +hH)
    const x0 = cx + 0 * cosT - (-hH) * sinT + shk, y0 = (-hH) * cosT + 0 * sinT
    const x1 = cx + 0 * cosT - ( hH) * sinT + shk, y1 = ( hH) * cosT + 0 * sinT
    ctx.save()
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.shadowColor = color
    ctx.shadowBlur = blur; ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.moveTo(wx(x0), wy(y0)); ctx.lineTo(wx(x1), wy(y1)); ctx.stroke()
    ctx.restore()
  }

  const colorL = wallNudgeLeft  > 0.05 ? `hsl(${200 + wallNudgeLeft  * 40},100%,${50 + wallNudgeLeft  * 30}%)` : '#0044aa'
  const colorR = wallNudgeRight > 0.05 ? `hsl(${200 + wallNudgeRight * 40},100%,${50 + wallNudgeRight * 30}%)` : '#0044aa'
  const shadowL = wallNudgeLeft  > 0.05 ? '#00ffff' : '#0066ff'
  const shadowR = wallNudgeRight > 0.05 ? '#00ffff' : '#0066ff'

  drawTiltedWallFill(wallCX_L, tL, shkL, colorL, shadowL)
  drawTiltedWallFill(wallCX_R, -tR, shkR, colorR, shadowR)

  // Top wall com shake vertical
  ctx.save()
  ctx.globalAlpha = 0.4; ctx.shadowColor = '#0066ff'; ctx.shadowBlur = ws(0.6)
  ctx.fillStyle = wallShakeTop > 0.05 ? `hsl(${200 + wallShakeTop * 40},100%,${50 + wallShakeTop * 20}%)` : '#0044aa'
  ctx.fillRect(wx(-FIELD_W / 2 - wt), wy(FIELD_H / 2 + wt + shkT), ws(FIELD_W + wt * 2), ws(wt))
  ctx.restore()

  // Neon inner edge glow — inclinado igual ao fill
  const edgeColorL = wallNudgeLeft  > 0.05 ? `hsl(${180 + wallNudgeLeft  * 60},100%,70%)` : '#0088ff'
  const edgeColorR = wallNudgeRight > 0.05 ? `hsl(${180 + wallNudgeRight * 60},100%,70%)` : '#0088ff'
  drawTiltedWallEdge(wallCX_L, tL, shkL, edgeColorL, 0.6 + wallNudgeLeft  * 0.35, 12 + wallNudgeLeft  * 24 + wallShakeLeft  * 18)
  drawTiltedWallEdge(wallCX_R, -tR, shkR, edgeColorR, 0.6 + wallNudgeRight * 0.35, 12 + wallNudgeRight * 24 + wallShakeRight * 18)

  // Top edge
  ctx.save()
  ctx.strokeStyle = wallShakeTop > 0.05 ? `hsl(${180 + wallShakeTop * 60},100%,70%)` : '#0088ff'
  ctx.globalAlpha = 0.6 + wallShakeTop * 0.3
  ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12 + wallShakeTop * 20
  ctx.lineWidth = 1.5
  ctx.beginPath()
  ctx.moveTo(wx(-FIELD_W / 2), wy(FIELD_H / 2 + shkT))
  ctx.lineTo(wx( FIELD_W / 2), wy(FIELD_H / 2 + shkT))
  ctx.stroke()
  ctx.restore()
}

// ─── Neon color helper ───
function hexToStr(h) { return '#' + h.toString(16).padStart(6, '0') }

// ─── Screen → Field X ───
function screenToFieldX(screenX) { return (screenX - cxOff) / scale }

// ═══ PADDLE ═══
function drawPaddle() {
  const px = paddleX, py = currentPaddleY
  const pw = ws(paddleW), ph = ws(PADDLE_H)
  const r = Math.min(5, pw / 4, ph / 4)

  ctx.save()
  ctx.translate(wx(px), wy(py))
  ctx.rotate(-paddleTilt)
  if (ghostTimer > 0) ctx.globalAlpha = 0.22

  // Outer glow halo
  const glowBlur = 14 + Math.sin(frame * 0.05) * 5
  ctx.shadowColor = '#00ffff'
  ctx.shadowBlur = glowBlur
  // Main body
  ctx.fillStyle = '#00ffff'
  ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, r); ctx.fill()

  // Inner specular highlight
  ctx.shadowBlur = 0
  ctx.fillStyle = 'rgba(255,255,255,0.28)'
  ctx.beginPath()
  ctx.roundRect(-pw / 2 + 2, -ph / 2 + 2, pw - 4, ph / 2 - 2, [r, r, 0, 0])
  ctx.fill()
  ctx.restore()
}

function rebuildPaddle(w) {
  paddleW = Math.max(1.0, Math.min(5.0, w))
}

function spawnPaddleThruster(color, dir) {
  for (let i = 0; i < 2; i++) {
    const ox = (Math.random() - 0.5) * paddleW * 0.8
    const spawnY = currentPaddleY + dir * PADDLE_H / 2
    const vx = (Math.random() - 0.5) * 0.03
    const vy = dir * (0.04 + Math.random() * 0.08)
    _spawnRawParticle(paddleX + ox, spawnY, vx, vy, color, 0.5 + Math.random() * 0.8, 0.04 + Math.random() * 0.03)
  }
}

function spawnPaddleThrusterBurst(color, dir) {
  for (let i = 0; i < 15; i++) {
    const ox = (Math.random() - 0.5) * paddleW
    const spawnY = currentPaddleY + dir * PADDLE_H / 2
    const vx = (Math.random() - 0.5) * 0.06
    const vy = dir * (0.06 + Math.random() * 0.14)
    _spawnRawParticle(paddleX + ox, spawnY, vx, vy, color, 0.8 + Math.random() * 1.5, 0.02 + Math.random() * 0.03)
  }
}

function mkBall(x, y, vx, vy, spd) {

}

function drawBall(b) {
  const bx = b.x, by = b.y

  const opa = 0.08 + Math.sin(frame * 0.1) * 0.04

  ctx.fillStyle = '#00ffff'
  ctx.shadowColor = '#00ffff'

  // Ball core
  ctx.save()

// ──── bricks.js ────
// ═══ BRICKS ═══
const hpColors = [0x00ccff, 0xffcc00, 0xff004d]

function createBricks() {
  bricks = []
  const tw = BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP
  const sx = -tw / 2 + BRICK_W / 2
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const isGlass = Math.random() < GLASS_CHANCE
      const hp = isGlass ? 1 : (1 + Math.floor(Math.random() * 3))
      const col = hpColors[hp - 1]
      const x = sx + c * (BRICK_W + BRICK_GAP)
      const y = BRICK_START_Y - r * (BRICK_H + BRICK_GAP)
      bricks.push({ x, y, hp, maxHp: hp, color: isGlass ? 0x88ccff : col, alive: true, hitAnim: 0, glass: isGlass, row: r })
    }
  }
  initialBrickCount = bricks.filter(b => !b.glass).length
  aliveBrickCount = initialBrickCount
}

function drawBrick(br) {
  const floatY = br.y + Math.sin(frame * 0.02 + br.x * 0.5) * 0.02
  const pw = ws(BRICK_W), ph = ws(BRICK_H)
  const bx = wx(br.x) - pw / 2, by = wy(floatY) - ph / 2
  const r = Math.min(3, pw / 5, ph / 5)
  const col = hexToStr(br.color)

  ctx.save()
  if (br.glass) {
    const glassOpa = 0.25 + Math.sin(frame * 0.04 + br.x) * 0.1
    ctx.globalAlpha = glassOpa
    ctx.fillStyle = '#aaeeff'
    ctx.shadowColor = '#88ccff'; ctx.shadowBlur = ws(0.4)
  } else {
    const hpRatio = br.hp / br.maxHp
    ctx.globalAlpha = 0.4 + hpRatio * 0.6
    ctx.fillStyle = col
    const ei = br.hitAnim > 0 ? 2.5 : (0.5 + br.row * 0.12)
    ctx.shadowColor = col; ctx.shadowBlur = ws(0.25 + ei * 0.12)
  }
  ctx.beginPath(); ctx.roundRect(bx, by, pw, ph, r); ctx.fill()

  // Edge highlight (non-glass only)
  if (!br.glass) {
    ctx.shadowBlur = 0
    ctx.globalAlpha = 0.35
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'
    ctx.lineWidth = 1
    ctx.beginPath(); ctx.roundRect(bx, by, pw, ph, r); ctx.stroke()
  }
  ctx.restore()
}

function drawBricks() {
  for (const br of bricks) {
    if (!br.alive) continue
    drawBrick(br)
    if (br.hitAnim > 0) br.hitAnim = Math.max(0, br.hitAnim - 0.05)
  }
}

// ═══ MUSIC INTENSITY ═══
function checkMusicIntensity() {
  if (initialBrickCount <= 0) return
  const pct = aliveBrickCount / initialBrickCount
  let newIntensity = 0
  if (pct <= 0.10) newIntensity = 2
  else if (pct <= 0.50) newIntensity = 1
  if (newIntensity !== musicIntensity) {
    musicIntensity = newIntensity
    if (musicPlaying) { stopMusic(); startMusic() }
  }
}


// ──── particles.js ────
// ═══ PARTICLES ═══
const pPool = []
const MAX_P = MAX_PARTICLES_CAP

// Raw spawn (used internally with custom velocity)
function _spawnRawParticle(x, y, vx, vy, color, size, decay) {
  let p
  if (pPool.length > 0) {
    p = pPool.pop()
    p.x = x; p.y = y; p.vx = vx; p.vy = vy
    p.color = color; p.size = size; p.life = 1; p.decay = decay
  } else if (particles.length < MAX_P) {
    p = { x, y, vx, vy, color, size, life: 1, decay }
  } else return
  particles.push(p)
}

function spawnP(x, y, color, n = 20) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2
    const sp = 0.05 + Math.random() * 0.18
    const size = (0.5 + Math.random() * 1.5) * 0.09
    _spawnRawParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, color, size, 0.01 + Math.random() * 0.025)
  }
}

function updateP() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]
    p.x += p.vx; p.y += p.vy
    p.vy -= 0.002
    p.life -= p.decay
    if (p.life <= 0) { pPool.push(p); particles.splice(i, 1) }
  }
}

function drawP() {
  for (const p of particles) {
    const s = Math.max(1, ws(p.size * p.life * 1.2))
    ctx.save()
    ctx.globalAlpha = p.life * 0.9
    ctx.fillStyle = hexToStr(p.color)
    ctx.fillRect(wx(p.x) - s / 2, wy(p.y) - s / 2, s, s)
    ctx.restore()
  }
}

// ═══ TRAILS ═══
const trailPool = []
const MAX_TRAILS = 80

function spawnTrail(x, y) {
  let t
  if (trailPool.length > 0) {
    t = trailPool.pop(); t.x = x; t.y = y; t.life = 1; t.decay = 0.06
  } else if (trails.length < MAX_TRAILS) {
    t = { x, y, life: 1, decay: 0.06 }
  } else return
  trails.push(t)
}

function updateTrails() {
  for (let i = trails.length - 1; i >= 0; i--) {
    const t = trails[i]; t.life -= t.decay
    if (t.life <= 0) { trailPool.push(t); trails.splice(i, 1) }
  }
}

function drawTrails() {
  for (const t of trails) {
    const r = Math.max(0.5, ws(BALL_R * 0.6 * t.life * 0.8))
    ctx.save()
    ctx.globalAlpha = t.life * 0.3
    ctx.fillStyle = '#00ffff'
    ctx.beginPath(); ctx.arc(wx(t.x), wy(t.y), r, 0, Math.PI * 2); ctx.fill()
    ctx.restore()
  }
}

// ═══ SCREEN SHAKE ═══
function shake(a) { shakeAmt = Math.max(shakeAmt, a) }

function updateShake() {
  if (shakeAmt > 0.01) {
    shakeX = (Math.random() - 0.5) * shakeAmt * scale * 0.5
    shakeY = (Math.random() - 0.5) * shakeAmt * scale * 0.5
    shakeAmt *= 0.88
  } else { shakeAmt = 0; shakeX = 0; shakeY = 0 }
}

const DROP_VISUAL_COLORS = [0xff00ff, 0x00ffff, 0xffff00, 0xff4444, 0x44ff44, 0x4488ff, 0xff8800, 0xaa44ff, 0xff66cc, 0x66ffcc]
const MAX_DROPS = 3

const MOBILE_BLOCKED_DROPS = ['slowmo', 'fastmo', 'bw', 'old_film']

function spawnDrop(x, y) {
  if (drops.length >= MAX_DROPS) return
  if (Math.random() > DROP_CHANCE) return
  const pool = IS_MOBILE
    ? DROP_TYPES_ALL.filter(t => !MOBILE_BLOCKED_DROPS.includes(t.id))
    : DROP_TYPES_ALL
  const t = pool[Math.floor(Math.random() * pool.length)]
  const vc = DROP_VISUAL_COLORS[Math.floor(Math.random() * DROP_VISUAL_COLORS.length)]
  drops.push({ x, y, type: t, visualColor: vc, vy: -0.06, angle: 0 })
}

function drawDrop(d) {
  const ps = ws(0.55)
  ctx.save()
  ctx.translate(wx(d.x), wy(d.y))
  d.angle += 0.05; ctx.rotate(d.angle)
  const col = hexToStr(d.visualColor)
  ctx.globalAlpha = 0.9
  ctx.shadowColor = col; ctx.shadowBlur = ws(0.5)
  ctx.fillStyle = col
  ctx.fillRect(-ps / 2, -ps / 2, ps, ps)
  ctx.restore()
}

function drawDrops() { for (const d of drops) drawDrop(d) }

function updateDrops() {
  const hw = paddleW / 2
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.y += d.vy
    const dx = d.x - paddleX, dy = d.y - currentPaddleY
    if (Math.abs(dx) < hw + 0.3 && Math.abs(dy) < 0.6) {
      SFX.dropCatch(); applyDrop(d.type); spawnP(d.x, d.y, d.type.color, 15)
      drops.splice(i, 1); continue
    }
    if (d.y < -FIELD_H / 2 - 1) drops.splice(i, 1)
  }
}

let filmNoiseRAF = null
function startFilmNoise() {
  const c = document.getElementById('film-noise')
  c.width = Math.floor(innerWidth / 4); c.height = Math.floor(innerHeight / 4)
  const fctx = c.getContext('2d')
  function drawNoise() {
    const img = fctx.createImageData(c.width, c.height), d = img.data
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 30 + Math.random() * 25 }
    for (let s = 0; s < 3; s++) { const sx = Math.floor(Math.random() * c.width); for (let y = 0; y < c.height; y++) { const idx = (y * c.width + sx) * 4; d[idx] = d[idx+1] = d[idx+2] = 200; d[idx+3] = 45 } }
    fctx.putImageData(img, 0, 0); filmNoiseRAF = requestAnimationFrame(drawNoise)
  }
  drawNoise()
}
function stopFilmNoise() {
  if (filmNoiseRAF) { cancelAnimationFrame(filmNoiseRAF); filmNoiseRAF = null }

  document.getElementById('film-overlay').style.display = 'none'

// ─── Drop Log ───
const TIMED_DROPS = new Set(['slowmo','fastmo','bw','crt','old_film','grow','shrink','glass','bomb','paddle_down','paddle_up','laser_sight','spin','ghost'])
function addDropLog(t) {
  const isTimed = TIMED_DROPS.has(t.id)
  for (let i = dropLog.length - 1; i >= 0; i--) { if (dropLog[i].id === t.id && dropLog[i].active) dropLog[i].active = false }
  const entry = { label: t.label, colorHex: '#' + t.color.toString(16).padStart(6, '0'), good: t.good, active: isTimed, id: t.id, permanent: !isTimed }
  dropLog.push(entry); renderDropLog(); return entry
}
function deactivateDropLog(id) {
  for (let i = dropLog.length - 1; i >= 0; i--) { if (dropLog[i].id === id && dropLog[i].active) { dropLog[i].active = false; break } }
  renderDropLog()
}
function renderDropLog() {
  const container = document.getElementById('drop-log')
  let html = '<div id="drop-log-title">Drops</div>'
  const start = Math.max(0, dropLog.length - 5)
  for (let i = dropLog.length - 1; i >= start; i--) {
    const e = dropLog[i], cls = e.good ? 'good' : 'bad', state = e.active ? 'active' : (e.permanent ? 'permanent' : 'expired')
    html += `<div class="drop-entry ${cls} ${state}" style="color:${e.active ? e.colorHex : ''}">${e.label}</div>`
  }
  container.innerHTML = html
}
function clearDropLog() { dropLog = []; renderDropLog() }
function clearAllFilters() {
  if (bwTimer > 0) { bwTimer = 0; deactivateDropLog('bw') }
  if (crtTimer > 0) { crtTimer = 0; document.getElementById('crt-overlay').style.display = 'none'; deactivateDropLog('crt') }
  if (filmTimer > 0) { filmTimer = 0; stopFilmNoise(); deactivateDropLog('old_film') }
  canvas.style.filter = ''
}


// ──── bombs.js ────
// ═══ BOMBS ═══
const BOMB_R = 0.25, BOMB_EXPLODE_R = 1.5, BOMB_SPEED = 0.16

function launchBomb(x, y) {
  const angle = Math.PI / 2 + (Math.random() - 0.5) * 0.4
  bombs.push({ x, y, vx: Math.cos(angle) * BOMB_SPEED, vy: Math.abs(Math.sin(angle)) * BOMB_SPEED, age: 0, rot: 0 })
  SFX.bombBounce()
}

function drawBomb(b) {
  ctx.save()
  ctx.translate(wx(b.x), wy(b.y))
  ctx.rotate(b.rot)
  // Outer glow
  ctx.globalAlpha = 0.15 + Math.sin(frame * 0.3) * 0.08
  ctx.shadowColor = '#ff6600'; ctx.shadowBlur = ws(BOMB_R * 5)
  ctx.fillStyle = '#ff6600'
  ctx.beginPath(); ctx.arc(0, 0, ws(BOMB_R * 3), 0, Math.PI * 2); ctx.fill()
  // Core
  ctx.globalAlpha = 1
  ctx.fillStyle = '#ff6600'
  ctx.shadowColor = '#ff4400'; ctx.shadowBlur = ws(BOMB_R * 3)
  ctx.beginPath(); ctx.arc(0, 0, ws(BOMB_R), 0, Math.PI * 2); ctx.fill()
  // Hot center
  ctx.fillStyle = '#ffcc44'
  ctx.beginPath(); ctx.arc(0, 0, ws(BOMB_R * 0.4), 0, Math.PI * 2); ctx.fill()
  ctx.restore()
}

function drawBombs() { for (const b of bombs) drawBomb(b) }

function explodeBomb(bomb) {
  SFX.bombExplode(); shake(1.2)
  spawnP(bomb.x, bomb.y, 0xff6600, 40)
  spawnP(bomb.x, bomb.y, 0xffcc00, 25)
  spawnP(bomb.x, bomb.y, 0xff2200, 20)
  const inRange = []
  for (const br of bricks) {
    if (!br.alive) continue
    const dx = br.x - bomb.x, dy = br.y - bomb.y
    const dist = Math.sqrt(dx * dx + dy * dy)
    if (dist < BOMB_EXPLODE_R) inRange.push({ br, dist })
  }
  inRange.sort((a, b) => a.dist - b.dist)
  const toDestroy = inRange.slice(0, 3)
  for (const { br } of toDestroy) {
    br.alive = false
    if (!br.glass) aliveBrickCount--
    score += (br.glass ? 5 : br.maxHp * 15) * 2
    spawnP(br.x, br.y, br.color, 15)
    if (!br.glass) spawnDrop(br.x, br.y)
  }
  updateHUD(); checkWin()
}

function updateBombs() {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i]; b.age++
    b.x += b.vx; b.y += b.vy; b.vy -= 0.0008; b.rot += 0.1
    if (frame % BOMB_TRAIL_INTERVAL === 0) spawnP(b.x, b.y, 0xff8800, 3)
    // Wall bounces
    if (b.x - BOMB_R < -FIELD_W / 2) { b.x = -FIELD_W / 2 + BOMB_R; b.vx = Math.abs(b.vx); SFX.bombBounce() }
    if (b.x + BOMB_R > FIELD_W / 2)  { b.x = FIELD_W / 2 - BOMB_R;  b.vx = -Math.abs(b.vx); SFX.bombBounce() }
    if (b.y + BOMB_R > FIELD_H / 2)  { b.y = FIELD_H / 2 - BOMB_R;  b.vy = -Math.abs(b.vy); SFX.bombBounce() }
    // Paddle bounce
    const bhw = paddleW / 2
    if (b.y - BOMB_R < currentPaddleY + PADDLE_H / 2 && b.y + BOMB_R > currentPaddleY - PADDLE_H / 2 &&
        b.x > paddleX - bhw - BOMB_R && b.x < paddleX + bhw + BOMB_R && b.vy < 0) {
      b.vy = Math.abs(b.vy); b.y = currentPaddleY + PADDLE_H / 2 + BOMB_R
      b.vx += ((b.x - paddleX) / bhw) * 0.06; SFX.bombBounce()
      spawnP(b.x, currentPaddleY + PADDLE_H / 2, 0xff6600, 6)
    }
    // Off bottom
    if (b.y - BOMB_R < -FIELD_H / 2) { bombs.splice(i, 1); continue }
    // Brick collision → explode
    if (b.age < 10) continue
    let hit = false
    for (const br of bricks) {
      if (!br.alive) continue
      if (Math.abs(b.x - br.x) < BRICK_W / 2 + BOMB_R && Math.abs(b.y - br.y) < BRICK_H / 2 + BOMB_R) { hit = true; break }
    }
    if (hit) { explodeBomb(b); bombs.splice(i, 1) }
  }
}

// ═══ SCOREBOARD ═══
const SCORE_STORAGE_KEY = 'shattergrid_scores_v1'

function loadScores() {
  try {
    const raw = localStorage.getItem(SCORE_STORAGE_KEY)
    return raw ? JSON.parse(raw) : []
  } catch (e) { return [] }
}

function saveScore(pts) {
  const scores = loadScores()
  scores.push({ score: pts, date: Date.now() })
  if (scores.length > 100) scores.splice(0, scores.length - 100)
  try { localStorage.setItem(SCORE_STORAGE_KEY, JSON.stringify(scores)) } catch (e) {}
}

function renderScoreboard(containerId, highlightScore) {
  const container = document.getElementById(containerId)
  if (!container) return
  const scores = loadScores()
  if (scores.length === 0) { container.innerHTML = ''; return }
  const last10 = scores.slice(-10).reverse()
  const top10 = [...scores].sort((a, b) => b.score - a.score).slice(0, 10)
  function fmtDate(ts) {
    const d = new Date(ts)
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  }
  function renderCol(title, list) {
    let h = `<div class="scoreboard-title">${title}</div>`
    list.forEach((e, i) => {
      const hl = (highlightScore !== undefined && e.score === highlightScore) ? ' highlight' : ''
      h += `<div class="scoreboard-entry${hl}"><span class="sb-rank">${i + 1}.</span><span class="sb-score">${e.score}</span><span class="sb-date">${fmtDate(e.date)}</span></div>`
    })
    return h
  }
  container.innerHTML = `<div class="scoreboard-container"><div class="scoreboard-col">${renderCol('Últimos 10', last10)}</div><div class="scoreboard-col">${renderCol('Top 10', top10)}</div></div>`
}

renderScoreboard('start-scoreboard')

// ─── repositionHUD — 2D canvas coords (no Three.js projection) ───
function repositionHUD() {
  // Field edges in canvas pixels
  const sL = wx(-FIELD_W / 2), sR = wx(FIELD_W / 2)
  const sT = wy(FIELD_H / 2),  sB = wy(-FIELD_H / 2)
  const fieldW = sR - sL

  const hud = document.getElementById('hud')
  hud.style.left  = Math.round(sL) + 'px'
  hud.style.width = Math.round(fieldW) + 'px'

  const logEl = document.getElementById('drop-log')
  if (IS_MOBILE) {
    logEl.style.left         = Math.round(sL) + 'px'
    logEl.style.width        = Math.round(fieldW) + 'px'
    logEl.style.top          = Math.max(Math.round(sT) - 20, 55) + 'px'
    logEl.style.flexDirection = 'row'
    logEl.style.flexWrap     = 'nowrap'
    logEl.style.overflowY    = ''
    logEl.style.maxHeight    = ''
  } else {
    const margin   = 14
    const fieldH   = sB - sT
    const maxLogH  = Math.round(fieldH * 0.8)
    const centerY  = Math.round(sT + fieldH / 2)
    logEl.style.left          = Math.round(sR + margin) + 'px'
    logEl.style.width         = Math.round(innerWidth - sR - margin - 10) + 'px'
    logEl.style.top           = Math.round(centerY - maxLogH / 2) + 'px'
    logEl.style.flexDirection = 'column'
    logEl.style.flexWrap      = 'nowrap'
    logEl.style.alignItems    = 'flex-start'
    logEl.style.overflowY     = 'auto'
    logEl.style.maxHeight     = maxLogH + 'px'
  }
}

// ═══ APPLY DROP ═══
function applyDrop(t) {
  const el = document.getElementById('powerup-popup')
  el.textContent = t.label
  el.style.color = '#' + t.color.toString(16).padStart(6, '0')
  el.classList.remove('show')
  void el.offsetWidth
  el.classList.add('show')
  if (t.good) SFX.powerGood()
  else SFX.powerBad()
  addDropLog(t)
  switch (t.id) {
    case 'grow':
      if (growTimer <= 0) savedPaddleW = paddleW
      rebuildPaddle(savedPaddleW + 0.6)
      growTimer = 8 * 60
      break
    case 'shrink':
      if (shrinkTimer <= 0) savedPaddleW = paddleW
      rebuildPaddle(savedPaddleW - 0.5)
      shrinkTimer = 4 * 60
      break
    case 'multiball': {
      const p = balls.find((b) => b.alive)
      if (p) {
        const spd = Math.max(p.speed, BALL_SPEED_INIT)
        const ang =
          Math.atan2(p.vy, p.vx) + Math.PI / 4 + (Math.random() - 0.5) * 0.3
        const nvx = Math.cos(ang) * spd
        let nvy = Math.sin(ang) * spd
        if (Math.abs(nvy) < 0.04) nvy = nvy >= 0 ? 0.04 : -0.04
        balls.push(mkBall(p.x, p.y, nvx, nvy, spd))
      }
      break
    }
    case 'life':
      lives = Math.min(lives + 1, 5)
      updateHUD()
      break
    case 'glass': {
      const tw = BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP
      const sx = -tw / 2 + BRICK_W / 2,
        ry = currentPaddleY + 3
      for (let c = 0; c < BRICK_COLS; c++) {
        const x = sx + c * (BRICK_W + BRICK_GAP)
        const br = {
          x,
          y: ry,
          hp: 1,
          maxHp: 1,
          color: 0x88ccff,
          alive: true,
          hitAnim: 0,
          glass: true,
          row: -1,
        }
        bricks.push(br)
        glassBrickIds.push(br)
      }
      glassTimer = 16 * 60
      break
    }
    case 'bomb':
      launchBomb(paddleX, currentPaddleY + PADDLE_H / 2 + 0.3)
      bombTimer = 16 * 60
      break
    case 'slowmo':
      if (timeScaleTimer > 0)
        deactivateDropLog(timeScale < 1 ? 'slowmo' : 'fastmo')
      timeScale = 0.7
      timeScaleTimer = 5 * 60
      timeAccum = 0
      break
    case 'fastmo':
      if (timeScaleTimer > 0)
        deactivateDropLog(timeScale < 1 ? 'slowmo' : 'fastmo')
      timeScale = 1.3
      timeScaleTimer = 3 * 60
      timeAccum = 0
      break
    case 'paddle_down': {
      if (paddleUpTimer > 0) { paddleUpTimer = 0; deactivateDropLog('paddle_up') }
      const MIN_Y = -FIELD_H / 2 + 1.5
      paddleYOffset = Math.max(-1.5, MIN_Y - PADDLE_Y)
      targetPaddleY = PADDLE_Y + paddleYOffset
      paddleDownTimer = 8 * 60
      spawnPaddleThrusterBurst(0x44ddaa, 1)
      break
    }
    case 'paddle_up': {
      if (paddleDownTimer > 0) { paddleDownTimer = 0; deactivateDropLog('paddle_down') }
      const MAX_Y = -FIELD_H / 2 + 6.0
      paddleYOffset = Math.min(1.5, MAX_Y - PADDLE_Y)
      targetPaddleY = PADDLE_Y + paddleYOffset
      paddleUpTimer = 8 * 60
      spawnPaddleThrusterBurst(0xdd4444, -1)
      break
    }
    case 'bw':
      clearAllFilters()
      bwTimer = 8 * 60
      canvas.style.filter = 'grayscale(1)'
      break
    case 'crt':
      clearAllFilters()
      crtTimer = 10 * 60
      document.getElementById('crt-overlay').style.display = 'block'
      canvas.style.filter = 'brightness(1.3) contrast(1.1) saturate(0.7) hue-rotate(-10deg)'
      break
    case 'old_film':
      clearAllFilters()
      filmTimer = 12 * 60
      document.getElementById('film-overlay').style.display = 'block'
      document.getElementById('film-noise').style.display = 'block'
      startFilmNoise()
      canvas.style.filter = 'sepia(0.7) contrast(0.7) saturate(0.3) brightness(0.7)'
      break
    case 'laser_sight':
      laserSightTimer = 16 * 60
      break
    case 'spin':
      spinTimer = 5 * 60
      break
    case 'ghost':
      ghostTimer = 5 * 60
      break
  }
}

// ═══ CHARGE ═══
function startCharge() {
  charging = true
  chTimer = 0
  chParts = []
  const p = balls[0]
  if (!p) return
  p.vx = 0
  p.vy = 0
  p.x = paddleX
  p.y = currentPaddleY + PADDLE_H / 2 + BALL_R + 0.1
}

function updateCharge() {
  if (!charging) return
  chTimer++
  const prog = chTimer / CHARGE_DUR
  const p = balls[0]
  if (!p) return
  p.x = paddleX
  p.y = currentPaddleY + PADDLE_H / 2 + BALL_R + 0.1
  if (chTimer % 12 === 0) SFX.chargeUp(prog)
  if (chTimer % CHARGE_PARTICLE_INTERVAL === 0) {
    const a = Math.random() * Math.PI * 2,
      dist = 3 + (1 - prog) * 4
    const col = prog < 0.5 ? 0x0066ff : prog < 0.8 ? 0x00ccff : 0xffffff
    _spawnRawParticle(
      p.x + Math.cos(a) * dist,
      p.y + Math.sin(a) * dist,
      ((p.x - (p.x + Math.cos(a) * dist)) * (0.04 + prog * 0.12)) / dist,
      ((p.y - (p.y + Math.sin(a) * dist)) * (0.04 + prog * 0.12)) / dist,
      col,
      0.12 + prog * 0.12,
      0.04 + Math.random() * 0.02,
    )
  }
  if (prog > 0.6) shakeAmt = Math.max(shakeAmt, (prog - 0.6) * 0.4)
  if (chTimer >= CHARGE_DUR) {
    charging = false
    chParts = []
    spawnP(p.x, p.y, 0x00ffff, 25)
    shake(0.6)
    SFX.chargeLaunch()
    const a = Math.PI / 2 + (Math.random() - 0.5) * 0.6
    p.speed = BALL_SPEED_INIT
    p.vx = Math.cos(a) * p.speed
    p.vy = Math.abs(Math.sin(a)) * p.speed
  }
}

  growTimer = 0
  shrinkTimer = 0
  glassTimer = 0
  bombTimer = 0
  paddleUpTimer = 0
  paddleDownTimer = 0
  createBricks()
  balls.push(
    mkBall(
      0,
      currentPaddleY + PADDLE_H / 2 + BALL_R + 0.1,
      0,
      0,
      BALL_SPEED_INIT,
    ),
  )
  startCharge()
  updateHUD()
}

function loseLife() {
  lives--
  shake(1.5)
  SFX.loseLife()
  updateHUD()
  if (lives <= 0) {
    gameState = 'gameover'
    muffleMusic()
    SFX.gameOver()
    saveScore(score)
    document.getElementById('final-score').textContent = score
    renderEndDrops('gameover-drops')
    renderScoreboard('gameover-scoreboard', score)
    document.getElementById('game-over-screen').style.display = 'flex'
  } else {
    combo = 0
    showLifeLost(lives)
    balls = []
    balls.push(
      mkBall(
        paddleX,
        currentPaddleY + PADDLE_H / 2 + BALL_R + 0.1,
        0,
        0,
        BALL_SPEED_INIT,
      ),
    )
    startCharge()
  }
}

function checkWin() {
  checkMusicIntensity()
  if (aliveBrickCount <= 0) {
    bricks.forEach((b) => {
      b.alive = false
    })
    gameState = 'win'
    stopMusic()
    SFX.win()
    saveScore(score)
    document.getElementById('win-score').textContent = score
    renderEndDrops('win-drops')
    renderScoreboard('win-scoreboard', score)
    document.getElementById('win-screen').style.display = 'flex'
  }
}

// ═══ LASER SIGHT ═══
function drawLaserSight() {
  const b = balls.find((bl) => bl.alive)
  if (!b || (b.vx === 0 && b.vy === 0)) return
  const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy)
  const dx = b.vx / spd,
    dy = b.vy / spd
  let tMin = 999
  if (dx < 0) {
    const t = (-FIELD_W / 2 + BALL_R - b.x) / dx
    if (t > 0 && t < tMin) tMin = t
  }
  if (dx > 0) {
    const t = (FIELD_W / 2 - BALL_R - b.x) / dx
    if (t > 0 && t < tMin) tMin = t
  }
  if (dy > 0) {
    const t = (FIELD_H / 2 - BALL_R - b.y) / dy
    if (t > 0 && t < tMin) tMin = t
  }
  if (dy < 0) {
    const t = (currentPaddleY + PADDLE_H / 2 + BALL_R - b.y) / dy
    if (t > 0 && t < tMin) tMin = t
  }
  const hx = b.x + dx * tMin,
    hy = b.y + dy * tMin
  const eps = 0.1
  let rnx = 0,
    rny = 0
  if (Math.abs(hx - (-FIELD_W / 2 + BALL_R)) < eps) {
    rnx = 1
  } else if (Math.abs(hx - (FIELD_W / 2 - BALL_R)) < eps) {
    rnx = -1
  } else if (Math.abs(hy - (FIELD_H / 2 - BALL_R)) < eps) {
    rny = -1
  } else {
    rny = 1
  }
  const dot = dx * rnx + dy * rny
  const rdx = dx - 2 * dot * rnx,
    rdy = dy - 2 * dot * rny
  const bx2 = hx + rdx * 3,
    by2 = hy + rdy * 3
  const pulse = 0.4 + Math.sin(frame * 0.15) * 0.2
  ctx.save()
  ctx.strokeStyle = '#ff0044'
  ctx.lineWidth = 1.5
  ctx.globalAlpha = pulse
  ctx.shadowColor = '#ff0044'
  ctx.shadowBlur = 6
  ctx.setLineDash([ws(0.18), ws(0.12)])
  ctx.beginPath()
  ctx.moveTo(wx(b.x), wy(b.y))
  ctx.lineTo(wx(hx), wy(hy))
  ctx.stroke()
  ctx.globalAlpha = pulse * 0.5
  ctx.beginPath()
  ctx.moveTo(wx(hx), wy(hy))
  ctx.lineTo(wx(bx2), wy(by2))
  ctx.stroke()
  ctx.restore()
}

// ═══ COLLISION ═══
function ballBrick(ball, br) {
  const hw = BRICK_W / 2 + BALL_R,
    hh = BRICK_H / 2 + BALL_R
  const dx = ball.x - br.x,
    dy = ball.y - br.y
  if (Math.abs(dx) < hw && Math.abs(dy) < hh) {
    if (!br.glass) {
      const ox = hw - Math.abs(dx),
        oy = hh - Math.abs(dy)
      if (ox < oy) {
        ball.vx = -ball.vx
        ball.x += dx > 0 ? ox : -ox
      } else {
        ball.vy = -ball.vy
        ball.y += dy > 0 ? oy : -oy
      }
    }
    return true
  }
  return false
}

// ═══ UPDATE ═══
function update() {
  if (gameState !== 'playing') return
  frame++
  // Effect timers
  if (bwTimer > 0) {
    bwTimer--
    if (bwTimer <= 0) {
      canvas.style.filter = ''
      deactivateDropLog('bw')
    }
  }
  if (crtTimer > 0) {
    crtTimer--
    if (crtTimer <= 0) {
      document.getElementById('crt-overlay').style.display = 'none'
      if (filmTimer <= 0 && bwTimer <= 0) canvas.style.filter = ''
      deactivateDropLog('crt')
    }
  }
  if (filmTimer > 0) {
    filmTimer--
    if (filmTimer <= 0) {
      stopFilmNoise()
      if (crtTimer <= 0 && bwTimer <= 0) canvas.style.filter = ''
      deactivateDropLog('old_film')
    }
  }
  if (growTimer > 0) {
    growTimer--
    if (growTimer <= 0) {
      rebuildPaddle(savedPaddleW)
      deactivateDropLog('grow')
      showDropExpiry('⬌ EXPAND', 0x00ff88)
      spawnP(paddleX, currentPaddleY, 0x00ff88, 20)
    }
  }
  if (shrinkTimer > 0) {
    shrinkTimer--
    if (shrinkTimer <= 0) {
      rebuildPaddle(savedPaddleW)
      deactivateDropLog('shrink')
      showDropExpiry('⬌ SHRINK', 0xff4444)
      spawnP(paddleX, currentPaddleY, 0xff4444, 20)
    }
  }
  if (glassTimer > 0) {
    glassTimer--
    if (glassTimer <= 0) {
      glassBrickIds.forEach((br) => {
        if (br.alive) {
          br.alive = false
          spawnP(br.x, br.y, 0x88ccff, 8)
        }
      })
      glassBrickIds = []
      deactivateDropLog('glass')
    }
  }
  if (bombTimer > 0) {
    bombTimer--
    if (bombTimer <= 0) deactivateDropLog('bomb')
  }
  if (paddleDownTimer > 0) {
    paddleDownTimer--
    if (frame % 3 === 0) spawnPaddleThruster(0x44ddaa, 1)
    if (paddleDownTimer <= 0) {
      paddleYOffset = 0
      targetPaddleY = PADDLE_Y
      deactivateDropLog('paddle_down')
      showDropExpiry('↓ PADDLE BAIXO', 0x44ddaa)
      spawnP(paddleX, currentPaddleY, 0x44ddaa, 25)
    }
  }
  if (paddleUpTimer > 0) {
    paddleUpTimer--
    if (frame % 3 === 0) spawnPaddleThruster(0xdd4444, -1)
    if (paddleUpTimer <= 0) {
      paddleYOffset = 0
      targetPaddleY = PADDLE_Y
      deactivateDropLog('paddle_up')
      showDropExpiry('↑ PADDLE ALTO', 0xdd4444)
      spawnP(paddleX, currentPaddleY, 0xdd4444, 25)
    }
  }
  if (laserSightTimer > 0) {
    laserSightTimer--
    if (laserSightTimer <= 0) deactivateDropLog('laser_sight')
  }
  if (spinTimer > 0) {
    spinTimer--
    if (spinTimer <= 0) {
      deactivateDropLog('spin')
      showDropExpiry('🌀 GIRO LOUCO', 0xff44ff)
      spawnP(paddleX, currentPaddleY, 0xff44ff, 20)
    }
  }
  if (ghostTimer > 0) {
    ghostTimer--
    if (ghostTimer <= 0) {
      deactivateDropLog('ghost')
      showDropExpiry('👻 FANTASMA', 0x6644aa)
      spawnP(paddleX, currentPaddleY, 0x6644aa, 20)
    }
  }
  // Paddle Y smooth
  if (Math.abs(currentPaddleY - targetPaddleY) > 0.01)
    currentPaddleY += (targetPaddleY - currentPaddleY) * 0.12
  else currentPaddleY = targetPaddleY
  // Paddle X smooth
  const hw = paddleW / 2,
    minX = -FIELD_W / 2 + hw,
    maxX = FIELD_W / 2 - hw
  const ct = Math.max(minX, Math.min(maxX, mouseX))
  const prevPX = paddleX
  paddleX += (ct - paddleX) * 0.3
  const paddleVel = paddleX - prevPX
  paddleTilt = spinTimer > 0 ? paddleTilt + 0.18 : paddleVel * 0.45

  // Nudge das paredes: acumula quando paddle pressiona o limite, decai quando não
  if (mouseX < minX) wallNudgeLeft  = Math.min(1, wallNudgeLeft  + 0.12)
  else                wallNudgeLeft  = Math.max(0, wallNudgeLeft  - 0.06)
  if (mouseX > maxX) wallNudgeRight = Math.min(1, wallNudgeRight + 0.12)
  else                wallNudgeRight = Math.max(0, wallNudgeRight - 0.06)

  // Tilt das paredes: segue o nudge suavemente (eixo central → inclina a parede)
  wallTiltLeft  += (wallNudgeLeft  * 0.22 - wallTiltLeft)  * 0.1
  wallTiltRight += (wallNudgeRight * 0.22 - wallTiltRight) * 0.1

  // Chacoalho das paredes: decai rápido a cada frame
  wallShakeLeft  *= 0.76
  wallShakeRight *= 0.76
  wallShakeTop   *= 0.76



  // Detecta primeiro contato do paddle com a parede lateral → dispara recoil + shake
  const atLeftWall  = paddleX <= minX + 0.02
  const atRightWall = paddleX >= maxX - 0.02
  if (atLeftWall && !prevAtLeftWall) {
    wallShakeLeft = Math.min(1, wallShakeLeft + 0.7)
    // Partículas: saem da borda esquerda em direção ao interior
    for (let i = 0; i < 7; i++) {
      const oy = (Math.random() - 0.5) * paddleW * 0.7
      _spawnRawParticle(
        minX, currentPaddleY + oy,
        0.06 + Math.random() * 0.09, (Math.random() - 0.5) * 0.06,
        0x00ccff, 0.14 + Math.random() * 0.10, 0.022 + Math.random() * 0.018
      )
    }
  }
  if (atRightWall && !prevAtRightWall) {
    wallShakeRight = Math.min(1, wallShakeRight + 0.7)
    // Partículas: saem da borda direita em direção ao interior
    for (let i = 0; i < 7; i++) {
      const oy = (Math.random() - 0.5) * paddleW * 0.7
      _spawnRawParticle(
        maxX, currentPaddleY + oy,
        -(0.06 + Math.random() * 0.09), (Math.random() - 0.5) * 0.06,
        0x00ccff, 0.14 + Math.random() * 0.10, 0.022 + Math.random() * 0.018
      )
    }
  }
  prevAtLeftWall  = atLeftWall
  prevAtRightWall = atRightWall

  if (charging) {
    updateCharge()
    updateDrops()
    updateBombs()
    return
  }
  let anyAlive = false
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const b = balls[bi]
    if (!b.alive) continue
    const curSpd = Math.sqrt(b.vx * b.vx + b.vy * b.vy)
    if (curSpd < BALL_SPEED_INIT * 0.5 && curSpd > 0) {
      const sc = BALL_SPEED_INIT / curSpd
      b.vx *= sc
      b.vy *= sc
    }
    if (Math.abs(b.vy) < 0.02) b.vy = b.vy >= 0 ? 0.02 : -0.02
    b.x += b.vx
    b.y += b.vy
    if (frame % TRAIL_INTERVAL === 0) spawnTrail(b.x, b.y)
    // Walls
    if (b.x - BALL_R < -FIELD_W / 2) {
      b.x = -FIELD_W / 2 + BALL_R
      // Reflexão com parede inclinada: normal = (cos(tilt), sin(tilt)) aponta pro interior
      const tL = wallTiltLeft
      const nLx = Math.cos(tL), nLy = Math.sin(tL)
      const dotL = b.vx * nLx + b.vy * nLy
      b.vx -= 2 * dotL * nLx
      b.vy -= 2 * dotL * nLy
      if (b.vx < 0) b.vx = Math.abs(b.vx) // garante afastamento da parede
      b.vy = Math.max(-b.speed * 0.95, Math.min(b.speed * 0.95, b.vy))
      wallShakeLeft = Math.min(1, wallShakeLeft + 0.9)
      shake(0.2 + wallNudgeLeft * 0.3)
      spawnP(b.x, b.y, wallNudgeLeft > 0.05 ? 0x00ffff : 0x0088ff, wallNudgeLeft > 0.05 ? 10 : 6)
      SFX.wallHit()
    }
    if (b.x + BALL_R > FIELD_W / 2) {
      b.x = FIELD_W / 2 - BALL_R
      // Reflexão com parede inclinada: normal = (-cos(tilt), sin(tilt))
      const tR = wallTiltRight
      const nRx = -Math.cos(tR), nRy = Math.sin(tR)
      const dotR = b.vx * nRx + b.vy * nRy
      b.vx -= 2 * dotR * nRx
      b.vy -= 2 * dotR * nRy
      if (b.vx > 0) b.vx = -Math.abs(b.vx) // garante afastamento da parede
      b.vy = Math.max(-b.speed * 0.95, Math.min(b.speed * 0.95, b.vy))
      wallShakeRight = Math.min(1, wallShakeRight + 0.9)
      shake(0.2 + wallNudgeRight * 0.3)
      spawnP(b.x, b.y, wallNudgeRight > 0.05 ? 0x00ffff : 0x0088ff, wallNudgeRight > 0.05 ? 10 : 6)
      SFX.wallHit()
    }
    if (b.y + BALL_R > FIELD_H / 2) {
      b.y = FIELD_H / 2 - BALL_R
      b.vy = -Math.abs(b.vy)
      wallShakeTop = Math.min(1, wallShakeTop + 0.9)
      shake(0.2)
      spawnP(b.x, b.y, 0x0088ff, 6)
      SFX.wallHit()
    }
    // Death
    if (b.y - BALL_R < -FIELD_H / 2) {
      spawnP(b.x, b.y, 0xff0044, 15)
      b.alive = false
      balls.splice(bi, 1)
      continue
    }
    // Paddle collision — OBB: transforma a bola para o espaço local do paddle
    const bx = b.x, by = b.y
    const cosT = Math.cos(paddleTilt), sinT = Math.sin(paddleTilt)
    const dx = bx - paddleX, dy = by - currentPaddleY
    // Posição da bola no referencial local do paddle (rotação inversa)
    const lx = dx * cosT + dy * sinT
    const ly = -dx * sinT + dy * cosT
    // Velocidade da bola no referencial local (só componente Y é necessária para checar direção)
    const lvy = -b.vx * sinT + b.vy * cosT
    if (
      Math.abs(lx) < hw + BALL_R &&
      Math.abs(ly) < PADDLE_H / 2 + BALL_R &&
      lvy < 0
    ) {
      const hp = Math.max(-0.95, Math.min(0.95, lx / hw))
      // Ângulo de saída no espaço local do paddle
      const ang = Math.PI / 2 + hp * (Math.PI / 3)
      b.speed = Math.min(b.speed + 0.003, BALL_SPEED_MAX)
      let nlvx = Math.cos(ang) * b.speed
      let nlvy = Math.sin(ang) * b.speed
      if (nlvy < 0.04) nlvy = 0.04
      // Converter de volta para espaço do mundo
      b.vx = nlvx * cosT - nlvy * sinT
      b.vy = nlvx * sinT + nlvy * cosT
      // Reposicionar a bola sobre a superfície do paddle (no espaço local)
      const newLy = PADDLE_H / 2 + BALL_R
      b.x = paddleX + lx * cosT - newLy * sinT
      b.y = currentPaddleY + lx * sinT + newLy * cosT
      // Garantir que a bola sobe no espaço do mundo (nunca fica presa)
      if (b.vy < 0.04) b.vy = 0.04
      shake(0.15)
      spawnP(bx, currentPaddleY + PADDLE_H / 2, 0x00ffff, 8)
      SFX.paddleHit()
      combo = 0
    }
    // Brick collision
    for (let i = 0; i < bricks.length; i++) {
      const br = bricks[i]
      if (!br.alive) continue
      if (ballBrick(b, br)) {
        br.hp--
        combo++
        const pts = (br.glass ? 5 : br.maxHp * 15) * Math.max(1, combo)
        score += pts
        showCombo(combo, pts)
        if (br.hp <= 0) {
          br.alive = false
          if (br.glass) {
            spawnP(br.x, br.y, 0xccffff, 20)
            SFX.glassBreak()
            shake(0.15)
          } else {
            aliveBrickCount--
            spawnP(br.x, br.y, br.color, 25)
            SFX.brickDestroy(combo)
            shake(0.4 + combo * 0.05)
            spawnDrop(br.x, br.y)
          }
          b.speed = Math.min(b.speed + 0.002, BALL_SPEED_MAX)
          const ca = Math.atan2(b.vy, b.vx)
          b.vx = Math.cos(ca) * b.speed
          b.vy = Math.sin(ca) * b.speed
        } else {
          br.hitAnim = 1
          spawnP(br.x, br.y, br.color, 8)
          SFX.brickHit(combo)
          shake(0.15)
        }
        updateHUD()
        checkWin()
        if (!br.glass) break
      }
    }
    anyAlive = true
  }
  if (!anyAlive && !charging) {
    loseLife()
    return
  }
  updateDrops()
  updateBombs()
}

// ═══ DRAW ═══
function draw() {
  ctx.save()
  ctx.translate(shakeX, shakeY)
  drawBackground()
  drawWalls()
  if (laserSightTimer > 0) drawLaserSight()
  drawTrails()
  drawBricks()
  drawPaddle()
  drawBalls()
  drawDrops()
  drawBombs()
  drawP()
  // Charge glow on ball
  if (charging && balls[0]) {
    const p = balls[0],
      prog = chTimer / CHARGE_DUR
    const r = ws(BALL_R * (1.5 + prog * 3))
    ctx.save()
    ctx.globalAlpha = 0.15 + prog * 0.4
    ctx.fillStyle = prog < 0.5 ? '#0066ff' : prog < 0.8 ? '#00ccff' : '#ffffff'
    ctx.shadowColor = '#00ffff'
    ctx.shadowBlur = r * 2
    ctx.beginPath()
    ctx.arc(wx(p.x), wy(p.y), r, 0, Math.PI * 2)
    ctx.fill()
    ctx.restore()
  }
  ctx.restore()
}

// ═══ ANIMATE (main loop) ═══
const TARGET_FPS = 60
const FRAME_BUDGET = 1000 / TARGET_FPS
let lastFrameTime = 0

function animate(now) {
  requestAnimationFrame(animate)
  lastFrameTime = now

  if (timeScaleTimer > 0) {
    // Decrementa proporcional aos steps para manter duração real igual entre mobile e desktop
    timeScaleTimer -= STEPS_PER_FRAME
    if (timeScaleTimer <= 0) {
      const wasId = timeScale < 1 ? 'slowmo' : 'fastmo'
      const wasColor = timeScale < 1 ? 0x8844ff : 0xff2288
      const wasLabel = timeScale < 1 ? '🐢 CÂMERA LENTA' : '⚡ CÂMERA RÁPIDA'
      deactivateDropLog(wasId)
      showDropExpiry(wasLabel, wasColor)
      spawnP(paddleX, currentPaddleY, wasColor, 20)
      timeScale = 1
      timeAccum = 0
    }
  }
  if (timeScaleTimer <= 0 && timeScale !== 1) {
    timeScale = 1
    timeAccum = 0
  }
  // Multiplica por STEPS_PER_FRAME para rodar física na mesma velocidade que 60fps
  timeAccum += timeScale * STEPS_PER_FRAME
  const steps = Math.floor(timeAccum)
  timeAccum -= steps
  for (let s = 0; s < steps; s++) update()
  updateP()
  updateTrails()
  updateShake()
  draw()
}

// ═══ INPUT ═══
document.addEventListener('mousemove', (e) => {
  if (IS_MOBILE) return
  // Desktop: movimento relativo — paddle anda o mesmo tanto que o mouse, independente da posição do cursor
  const delta = Math.max(-80, Math.min(80, e.movementX))
  mouseX += delta / scale
  mouseX = Math.max(-FIELD_W / 2, Math.min(FIELD_W / 2, mouseX))
})
document.addEventListener(
  'touchmove',
  (e) => {
    e.preventDefault()
    mouseX = screenToFieldX(e.touches[0].clientX)
  },
  { passive: false },
)

function handleTap() {
  ensureAudio()
  if (gameState === 'start') {
    gameState = 'playing'
    document.getElementById('start-screen').style.display = 'none'
    initGame()
    startMusic()
  } else if (gameState === 'gameover') {
    gameState = 'playing'
    document.getElementById('game-over-screen').style.display = 'none'
    unmuffleMusic()
    initGame()
    startMusic()
  } else if (gameState === 'win') {
    gameState = 'playing'
    document.getElementById('win-screen').style.display = 'none'
    initGame()
    startMusic()
  }
}
document.addEventListener('click', () => {
  if (gameState !== 'paused') handleTap()
})
document.addEventListener(
  'touchstart',
  (e) => {
    if (e.touches.length >= 2) {
      e.preventDefault()
      if (gameState === 'playing' || gameState === 'paused') togglePause()
      return
    }
    if (gameState !== 'playing' && gameState !== 'paused') {
      e.preventDefault()
      handleTap()
    }
  },
  { passive: false },
)

// ═══ PAUSE ═══
function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused'
    document.getElementById('pause-screen').style.display = 'flex'
    muffleMusic()
  } else if (gameState === 'paused') {
    gameState = 'playing'
    document.getElementById('pause-screen').style.display = 'none'
    unmuffleMusic()
  }
}
document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' || e.code === 'Space') {
    e.preventDefault()
    if (gameState === 'playing' || gameState === 'paused') togglePause()
  }
})

// ═══ RESIZE & START ═══
addEventListener('resize', () => {
  resize()
  repositionHUD()
})
repositionHUD()
animate()



})()
</script>
