<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SHATTER GRID // TURBO 2D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;cursor:none;user-select:none;touch-action:none;-webkit-touch-callout:none;}
canvas{display:block;}
#game-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
#hud{position:absolute;top:20px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-family:'Orbitron',monospace;color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff;}
#score-label,#lives-label,#combo-label{font-size:11px;letter-spacing:3px;opacity:0.6;text-transform:uppercase;}
#score-value,#lives-value,#combo-value{font-size:28px;font-weight:900;}
#timer-value{font-size:11px;letter-spacing:2px;opacity:0.75;margin-top:2px;color:#0ff;}
#combo-container{text-align:center;color:#f0f;text-shadow:0 0 10px #f0f,0 0 20px #f0f;}
#lives-container{text-align:right;color:#0f0;text-shadow:0 0 10px #0f0,0 0 20px #0f0;}
.hud-group{min-width:120px;}
#start-screen,#game-over-screen,#win-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.95) 100%);pointer-events:all;transition:opacity 0.5s;overflow-y:auto;scrollbar-width:none;}
#game-over-screen::-webkit-scrollbar,#win-screen::-webkit-scrollbar{display:none;}
#game-over-screen,#win-screen{display:none;}
.title{font-family:'Orbitron',monospace;font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 20px #0ff,0 0 40px #0ff,0 0 80px #08f;letter-spacing:8px;margin-bottom:10px;animation:glow-pulse 2s ease-in-out infinite;}
.subtitle{font-family:'Rajdhani',sans-serif;font-size:18px;color:#0ff;letter-spacing:12px;text-transform:uppercase;opacity:0.7;margin-bottom:50px;}
.prompt{font-family:'Rajdhani',sans-serif;font-size:16px;color:#fff;letter-spacing:6px;text-transform:uppercase;opacity:0.5;animation:blink 1.5s ease-in-out infinite;}
.final-score{font-family:'Orbitron',monospace;font-size:48px;color:#f0f;text-shadow:0 0 20px #f0f,0 0 40px #f0f;margin:20px 0;}
@keyframes glow-pulse{0%,100%{text-shadow:0 0 20px #0ff,0 0 40px #0ff,0 0 80px #08f;}50%{text-shadow:0 0 30px #0ff,0 0 60px #0ff,0 0 120px #08f;}}
@keyframes blink{0%,100%{opacity:0.5;}50%{opacity:1;}}
#combo-popup,#life-lost-popup,#powerup-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-weight:900;pointer-events:none;opacity:0;white-space:nowrap;max-width:90vw;text-align:center;}
#combo-popup{font-size:48px;text-shadow:0 0 20px currentColor,0 0 40px currentColor;}
#life-lost-popup{font-size:42px;color:#ff0044;text-shadow:0 0 20px #ff0044,0 0 40px #ff0044,0 0 60px #a00;}
#powerup-popup{font-size:32px;top:60%;text-shadow:0 0 15px currentColor,0 0 30px currentColor;}
#combo-popup.show{animation:popup-anim 0.8s ease-out forwards;}
#life-lost-popup.show{animation:life-anim 1.2s ease-out forwards;}
#powerup-popup.show{animation:popup-anim 1s ease-out forwards;}
@keyframes popup-anim{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3);}40%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-60%) scale(0.9);}}
@keyframes life-anim{0%{opacity:1;transform:translate(-50%,-50%) scale(2);}15%{opacity:1;transform:translate(-50%,-50%) scale(1);}70%{opacity:0.8;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-55%) scale(0.8);}}
@media(max-width:600px){.title{font-size:28px;letter-spacing:3px;}.subtitle{font-size:12px;letter-spacing:6px;margin-bottom:30px;}.prompt{font-size:12px;letter-spacing:3px;}.final-score{font-size:32px;}#score-label,#lives-label,#combo-label{font-size:8px;letter-spacing:1.5px;}#score-value,#lives-value,#combo-value{font-size:18px;}.hud-group{min-width:60px;}#combo-popup{font-size:28px!important;}#life-lost-popup{font-size:22px;}#powerup-popup{font-size:18px;}#hud{padding:0 4px;top:10px;}#timer-value{font-size:9px;}}
@media(max-width:380px){.title{font-size:22px;letter-spacing:2px;}.subtitle{font-size:10px;letter-spacing:4px;}#score-value,#lives-value,#combo-value{font-size:15px;}#score-label,#lives-label,#combo-label{font-size:7px;letter-spacing:1px;}.hud-group{min-width:45px;}#combo-popup{font-size:22px!important;}#life-lost-popup{font-size:18px;}#powerup-popup{font-size:14px;}}
#crt-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.35) 0px,rgba(0,0,0,0.35) 1px,transparent 1px,transparent 3px),repeating-linear-gradient(90deg,rgba(0,255,100,0.03) 0px,rgba(0,255,100,0.03) 2px,transparent 2px,transparent 4px);animation:crt-flicker 0.06s infinite;}
#crt-overlay::after{content:'';position:absolute;top:-2%;left:-2%;width:104%;height:104%;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%);border-radius:18px;}
@keyframes crt-flicker{0%{opacity:0.92;}25%{opacity:1;}50%{opacity:0.95;}75%{opacity:1;}100%{opacity:0.93;}}
#film-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;mix-blend-mode:multiply;}
#film-overlay::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(20,15,10,0.2) 0%,rgba(0,0,0,0.55) 100%);}
#film-noise{display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;opacity:0.12;}
#drop-log{position:fixed;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;pointer-events:none;z-index:11;font-family:'Rajdhani',sans-serif;font-size:13px;line-height:1.2;overflow:hidden;white-space:nowrap;}
#drop-log::-webkit-scrollbar{display:none;}
#drop-log-title{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#556;flex-shrink:0;}
.drop-entry{padding:1px 5px;border-radius:3px;border-left:2px solid;transition:opacity 0.5s,text-shadow 0.3s;flex-shrink:0;white-space:nowrap;}
.drop-entry.active{opacity:1;text-shadow:0 0 6px currentColor,0 0 12px currentColor,0 0 20px currentColor;animation:neon-pulse 1.5s ease-in-out infinite;}
@keyframes neon-pulse{0%,100%{text-shadow:0 0 6px currentColor,0 0 12px currentColor,0 0 20px currentColor;}50%{text-shadow:0 0 8px currentColor,0 0 18px currentColor,0 0 30px currentColor,0 0 40px currentColor;}}
.drop-entry.expired{opacity:0.3;}.drop-entry.permanent{opacity:0.6;}.drop-entry.good{color:#0f8;border-left-color:#0f8;}.drop-entry.bad{color:#f44;border-left-color:#f44;}
#pause-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.9) 100%);pointer-events:all;z-index:15;}
.end-drops{margin-top:15px;max-height:30vh;overflow-y:auto;width:260px;scrollbar-width:none;}.end-drops::-webkit-scrollbar{display:none;}
.end-drops-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#556;margin-bottom:6px;text-align:center;}
.end-drops .drop-entry{font-family:'Rajdhani',sans-serif;font-size:16px;}
@media(max-width:600px){#drop-log{font-size:11px;gap:4px;}#drop-log-title{font-size:8px;}.end-drops{width:190px;}.end-drops .drop-entry{font-size:13px;}}
@media(max-width:380px){#drop-log{font-size:10px;gap:3px;}.end-drops{width:160px;}}
.scoreboard-container{display:flex;gap:20px;margin-top:15px;max-width:90vw;}
.scoreboard-col{min-width:140px;max-height:35vh;overflow-y:auto;scrollbar-width:none;}.scoreboard-col::-webkit-scrollbar{display:none;}
.scoreboard-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#0ff;margin-bottom:6px;text-align:center;text-shadow:0 0 8px #0ff;}
.scoreboard-entry{font-family:'Rajdhani',sans-serif;font-size:14px;color:#aab;padding:2px 8px;margin-bottom:1px;border-left:2px solid #334;display:flex;justify-content:space-between;gap:12px;}
.scoreboard-entry .sb-result{font-size:11px;flex-shrink:0;}.scoreboard-entry .sb-rank{color:#556;min-width:20px;}.scoreboard-entry .sb-score{color:#0ff;font-weight:700;}.scoreboard-entry .sb-time{color:#0f8;font-size:11px;}.scoreboard-entry .sb-date{color:#556;font-size:11px;}
.scoreboard-entry.highlight{border-left-color:#f0f;color:#f0f;}.scoreboard-entry.highlight .sb-score{color:#f0f;text-shadow:0 0 6px #f0f;}
@media(max-width:600px){.scoreboard-container{gap:10px;flex-direction:column;align-items:center;}.scoreboard-col{min-width:200px;max-height:20vh;}.scoreboard-title{font-size:9px;}.scoreboard-entry{font-size:12px;}}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="crt-overlay"></div>
<div id="film-overlay"></div>
<canvas id="film-noise"></canvas>
<div id="ui-overlay">
  <div id="hud">
    <div class="hud-group" id="score-container"><div id="score-label">Score</div><div id="score-value">0</div><div id="timer-value">0:00.000</div></div>
    <div class="hud-group" id="combo-container"><div id="combo-label">Combo</div><div id="combo-value">x1</div></div>
    <div class="hud-group" id="lives-container"><div id="lives-label">Lives</div><div id="lives-value">♥♥♥</div></div>
  </div>
  <div id="start-screen">
    <div class="title">SHATTER GRID</div>
    <div class="subtitle">Turbo 2D</div>
    <div id="start-scoreboard"></div>
    <div class="prompt">Toque para iniciar</div>
  </div>
  <div id="drop-log"><div id="drop-log-title">Drops</div></div>
  <div id="combo-popup"></div>
  <div id="life-lost-popup"></div>
  <div id="powerup-popup"></div>
  <div id="pause-screen">
    <div class="title" style="color:#0ff;text-shadow:0 0 20px #0ff,0 0 40px #0ff,0 0 80px #08f;">PAUSE</div>
    <div class="prompt" style="margin-top:20px;">ESC / ESPAÇO / 2 dedos para continuar</div>
  </div>
  <div id="game-over-screen">
    <div class="title" style="color:#f44;text-shadow:0 0 20px #f44,0 0 40px #f44,0 0 80px #a00;">GAME OVER</div>
    <div class="final-score" id="final-score">0</div>
    <div class="end-drops" id="gameover-drops"></div>
    <div id="gameover-scoreboard"></div>
    <div class="prompt">Toque para reiniciar</div>
  </div>
  <div id="win-screen">
    <div class="title" style="color:#0f0;text-shadow:0 0 20px #0f0,0 0 40px #0f0,0 0 80px #0a0;">VITÓRIA</div>
    <div class="final-score" id="win-score">0</div>
    <div id="win-time" style="font-family:'Orbitron',monospace;font-size:18px;color:#0f8;text-shadow:0 0 10px #0f8,0 0 20px #0f8;margin-top:-8px;letter-spacing:3px;">⏱ 0:00</div>
    <div class="end-drops" id="win-drops"></div>
    <div id="win-scoreboard"></div>
    <div class="prompt">Toque para jogar novamente</div>
  </div>
</div>
<script>
;(function(){
/* __GAME_CODE__ */
})()
</script>
</body>
</html>
